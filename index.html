<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub IA · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0D1A; --ink-2:#1B2140; --text2:#545B70; --text3:#9298A8;
  --bg:#F5F6FA; --card:#FFFFFF; --border:#E6E8EF; --border-soft:#EFF1F5;
  --blue:#2563EB; --blue-d:#1E3A8A; --blue-n:#0A1D8A; --blue-l:#E8EEFE;
  --red:#EE1554; --red-l:#FDE7EE; --amber:#F59E0B; --amber-l:#FEF3DC; --green:#16A34A; --green-l:#E6F6EC;
  --night:#05050A; --night-2:#0F0F18; --gov:#4BE0A1;
  --sig: linear-gradient(90deg,#2563EB 0%,#EE1554 60%,#F59E0B 100%);
  --sh: 0 2px 24px rgba(11,13,26,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;display:flex;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- barra lateral ---------- */
aside{width:262px;flex-shrink:0;background:var(--night);color:#fff;display:flex;flex-direction:column;height:100vh;border-right:1px solid rgba(37,99,235,.35)}
.brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{height:22px;display:block}
.brand .t{font-size:17px;font-weight:800;letter-spacing:-.4px;margin-top:12px;display:flex;align-items:center;gap:8px}
.brand .t i{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.brand .co{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:2px}
nav{flex:1;overflow-y:auto;padding:12px 12px}
nav .sec{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.38);padding:14px 10px 6px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;color:rgba(255,255,255,.78);text-decoration:none;font-size:13.2px;font-weight:500;margin-bottom:2px;transition:background .15s}
nav a:hover{background:rgba(255,255,255,.06);color:#fff}
nav a.on{background:linear-gradient(90deg,rgba(37,99,235,.35),rgba(37,99,235,.08));color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
nav a .b{margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,255,255,.1);border-radius:8px;padding:1px 7px}
nav a.nx{border:1px solid rgba(75,224,161,.35);margin-top:4px}
nav a.nx.on{background:linear-gradient(90deg,rgba(75,224,161,.22),rgba(75,224,161,.04));box-shadow:inset 2px 0 0 var(--gov)}
nav a.nx svg{color:var(--gov)}
nav a.hidden{display:none}
.who{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.who .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:6px}
.who select{width:100%;background:var(--night-2);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;color:#fff;font-size:12.5px}
.who .u{display:flex;align-items:center;gap:10px;margin-top:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--sig);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.who .u b{font-size:12.5px;display:block}.who .u span{font-size:11px;color:rgba(255,255,255,.5)}
.pw{display:flex;align-items:center;gap:8px;font-size:10.5px;color:rgba(255,255,255,.4);padding:10px 16px 14px}
.pw img{height:11px;opacity:.75}

/* ---------- zona principal ---------- */
main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
header{height:64px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 28px}
header h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
header .crumb{font-size:12px;color:var(--text3)}
header .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--text2);white-space:nowrap}
.chip.demo{background:var(--amber-l);border-color:transparent;color:#B45309}
.chip.ok{background:var(--green-l);border-color:transparent;color:#15803D}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.msel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.msel select{border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:#fff;font-size:12px;font-weight:600;color:var(--ink)}
#view{flex:1;overflow-y:auto;padding:26px 28px 40px}

/* ---------- componentes ---------- */
.hd{margin-bottom:18px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:9px;margin-bottom:6px}
.eyebrow::before{content:"";width:24px;height:2px;border-radius:2px;background:var(--sig)}
.hd h2{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.hd h2 .acc{color:var(--blue)}
.hd p{color:var(--text2);font-size:13.5px;margin-top:4px;max-width:900px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh);padding:18px 20px;position:relative;overflow:hidden}
.card.top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--sig)}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--text3)}
.g{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:14px}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:8px}
.kpi .l .ic{width:30px;height:30px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center}
.kpi .l .ic svg{width:15px;height:15px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:10px;line-height:1}
.kpi .v small{font-size:13px;font-weight:600;color:var(--text3);letter-spacing:0}
.kpi .d{font-size:11.5px;margin-top:6px;color:var(--text2)}
.up{color:#15803D;font-weight:600}.down{color:var(--red);font-weight:600}
.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-gov{color:#13A46E}
.bar{height:8px;border-radius:6px;background:var(--border-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0A1D8A,#2563EB)}
.bar.warn>i{background:linear-gradient(90deg,#EE1554,#F59E0B)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.cl{cursor:pointer}tr.cl:hover td{background:#FAFBFD}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:10px;background:var(--blue-l);color:var(--blue);white-space:nowrap}
.pill.green{background:var(--green-l);color:#15803D}.pill.red{background:var(--red-l);color:var(--red)}.pill.amber{background:var(--amber-l);color:#B45309}.pill.gray{background:#F1F2F6;color:var(--text2)}
.pill.gov{background:rgba(75,224,161,.16);color:#0F8A5B}
.user{display:flex;align-items:center;gap:9px}
.user .av{width:28px;height:28px;font-size:10.5px}
.user b{font-weight:600;font-size:12.8px;display:block;line-height:1.2}.user span{font-size:11px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:11px;padding:9px 15px;font-weight:600;font-size:12.8px;background:var(--ink);color:#fff;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn.blue{background:linear-gradient(90deg,#1E3A8A,#2563EB);box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn.sm{padding:6px 11px;font-size:11.8px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--border);border-radius:11px;padding:10px 12px;background:#fff;font-size:13px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
textarea.f{resize:vertical;line-height:1.5}
.night{background:var(--night);color:#fff;border-radius:18px;padding:18px 20px;border:1.5px solid rgba(37,99,235,.85);box-shadow:0 0 0 1px rgba(37,99,235,.15),0 0 26px rgba(37,99,235,.28) inset}
.night h3{color:#fff;font-size:14.5px;display:flex;align-items:center;gap:9px;margin-bottom:8px}
.night h3 i{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);display:inline-block}
.night p,.night li{color:rgba(255,255,255,.84);font-size:13px;line-height:1.6}
.night.gv{border-color:rgba(75,224,161,.8);box-shadow:0 0 26px rgba(75,224,161,.18) inset}
.night.gv h3 i{background:var(--gov);box-shadow:0 0 10px var(--gov)}
ul.dots{list-style:none}ul.dots li{padding-left:16px;position:relative;margin-bottom:6px;font-size:13px;line-height:1.55;color:var(--text2)}
ul.dots li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.night ul.dots li{color:rgba(255,255,255,.85)}
.ai{border-left:3px solid var(--blue);background:linear-gradient(90deg,var(--blue-l),#fff);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.ai .t{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.muted{color:var(--text3);font-size:12px}
.feed li{list-style:none;display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.6px;line-height:1.45}
.feed li:last-child{border-bottom:none}
.feed .tm{color:var(--text3);font-size:11px;white-space:nowrap;margin-left:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:11px;padding:8px 13px;font-size:12.6px;font-weight:600;color:var(--text2)}
.tabs button.on{background:var(--night);color:#fff;border-color:var(--night)}
.typing::after{content:"▍";animation:bl 1s infinite;color:var(--blue)}
@keyframes bl{50%{opacity:0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue-l);border-top-color:var(--blue);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;right:24px;bottom:24px;background:var(--night);color:#fff;border-radius:14px;padding:12px 16px;font-size:13px;box-shadow:0 10px 30px rgba(11,13,26,.25);border:1px solid rgba(37,99,235,.6);display:flex;gap:10px;align-items:center;transform:translateY(120%);opacity:0;transition:all .3s;z-index:50;max-width:420px}
.toast.on{transform:none;opacity:1}
.drawer{position:fixed;top:0;right:0;width:470px;max-width:92vw;height:100vh;background:#fff;box-shadow:-20px 0 60px rgba(11,13,26,.18);transform:translateX(100%);transition:transform .3s,visibility .3s;visibility:hidden;z-index:40;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible}
.drawer .dh{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer .db{padding:18px 22px;overflow-y:auto;flex:1}
.drawer .x{margin-left:auto;background:var(--bg);border:none;border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:12.8px;margin-bottom:14px}
.kv dt{color:var(--text3);font-weight:600}
.bubble{border-radius:14px;padding:11px 14px;font-size:13px;line-height:1.55;margin-bottom:10px;max-width:88%}
.bubble.me{background:var(--night);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble.bot{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.src{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chatbox{display:flex;flex-direction:column;height:430px}
.chatbox .msgs{flex:1;overflow-y:auto;padding:4px 2px 10px}
.chatbox .in{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sugg button{border:1px dashed var(--border);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--text2)}
.sugg button:hover{border-color:var(--blue);color:var(--blue)}
.drop{border:2px dashed #C9D3EA;border-radius:16px;padding:30px;text-align:center;background:linear-gradient(180deg,#fff,var(--bg))}
.drop svg{width:34px;height:34px;color:var(--blue)}
.diff td{background:var(--red-l)!important}
.tog{width:38px;height:22px;border-radius:12px;background:#D7DBE6;position:relative;border:none;transition:background .2s;flex-shrink:0}
.tog::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--green)}.tog.on::after{left:19px}
.rule{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft)}
.rule:last-child{border-bottom:none}
.rule b{font-size:13px;display:block}.rule span{font-size:12px;color:var(--text2)}
.post{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:#fff}
.post .ph{height:120px;border-radius:10px;background:linear-gradient(135deg,#0A1D8A,#2563EB 45%,#EE1554 80%,#F59E0B);margin-bottom:10px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:11px;font-weight:600}
.post p{font-size:12.8px;line-height:1.55;white-space:pre-line}
.post .meta{display:flex;gap:6px;margin-top:10px;align-items:center}
.lock{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;text-align:center;color:var(--text2)}
.lock svg{width:44px;height:44px;color:var(--red);margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col h4{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:flex;justify-content:space-between}
.deal{background:#fff;border:1px solid var(--border);border-radius:13px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh)}
.deal:hover{border-color:var(--blue)}
.deal b{font-size:12.8px;display:block}.deal .am{font-size:15px;font-weight:800;letter-spacing:-.4px;margin:4px 0}
.deal .nx{font-size:11.2px;color:var(--text2);line-height:1.4}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3,.g21,.g12,.pipe{grid-template-columns:1fr}}
</style>
</head>

function spark(arr, col='#2563EB'){ const w=90,h=26,mx=Math.max(...arr),mn=Math.min(...arr); const pts = arr.map((v,i)=>`${(i/(arr.length-1))*w},${h-((v-mn)/(mx-mn||1))*(h-4)-2}`).join(' '); return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

/* =================== gráficos =================== */
function barsChart(data, h=250){
  const w = 760, mx = Math.max(...data), bw = w/data.length;
  let s = `<svg viewBox="0 0 ${w} ${h+22}" width="100%" preserveAspectRatio="none" style="display:block"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0A1D8A"/></linearGradient></defs>`;
  [0.25,0.5,0.75,1].forEach(f=> s += `<line x1="0" x2="${w}" y1="${h-h*f}" y2="${h-h*f}" stroke="#EFF1F5"/>`);
  data.forEach((v,i)=>{ const bh = (v/mx)*(h-10); s += `<rect x="${i*bw+3}" y="${h-bh}" width="${bw-6}" height="${bh}" rx="4" fill="${i===data.length-1?'#EE1554':'url(#gb)'}"><title>${v} consultas</title></rect>`; if(i%5===0){ const dt = new Date(2026,9,19+i); s += `<text x="${i*bw+bw/2}" y="${h+16}" font-size="10" text-anchor="middle" fill="#9298A8">${dt.getDate()} ${['oct','nov'][dt.getMonth()-9]}</text>`; } });
  return s + '</svg>';
}
function lineChart(series, labels, h=190){
  const w=760, all = series.flatMap(s=>s.d), mx = Math.max(...all)*1.1, mn = 0;
  const X = i => 20 + i*(w-40)/(labels.length-1), Y = v => h - ((v-mn)/(mx-mn))*(h-20);
  let s = `<svg viewBox="0 0 ${w} ${h+22}" width="100%" style="display:block">`;
  [0.25,0.5,0.75,1].forEach(f=> s += `<line x1="0" x2="${w}" y1="${h-(h-20)*f}" y2="${h-(h-20)*f}" stroke="#EFF1F5"/>`);
  series.forEach(se => {
    const pts = se.d.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    if(se.fill) s += `<polygon points="${X(0)},${h} ${pts} ${X(se.d.length-1)},${h}" fill="${se.c}" opacity=".08"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${se.c}" stroke-width="2.5" ${se.dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    se.d.forEach((v,i)=> s += `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="#fff" stroke="${se.c}" stroke-width="2"><title>${labels[i]}: ${num(v)}</title></circle>`);
  });
  labels.forEach((l,i)=> s += `<text x="${X(i)}" y="${h+16}" font-size="10" text-anchor="middle" fill="#9298A8">${l}</text>`);
  return s + '</svg>';
}
function donut(parts, size=150){
  const r=56, c=2*Math.PI*r; let off=0, s=`<svg width="${size}" height="${size}" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#EFF1F5" stroke-width="18"/>`;
  parts.forEach(p=>{ const len = c*p.v/100; s += `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; });
  return s + `<text x="75" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#0B0D1A">412 €</text><text x="75" y="90" text-anchor="middle" font-size="10" fill="#9298A8">este mes</text></svg>`;
}

  $('#view').innerHTML = `<div class="fade">${hd('NexusMind · Gobierno de la IA', 'Gobierno de la IA de <span class="acc">toda la empresa</span>', 'Control de accesos, consumo, modelos, conocimiento, seguridad y auditoría de cada interacción con la IA, conectado con el Hub.')}
  <div class="tabs">${T.map(([k,n])=>`<button class="${k===ntab?'on':''}" onclick="ntab='${k}';nexus()">${n}</button>`).join('')}</div><div id="nx"></div></div>`;
  NX[ntab]();
}

async function dlpTest(){ const v = $('#dl').value; const o = $('#dlo'); o.innerHTML = '<span class="spin"></span>'; await sleep(600);
  const hit = /\b\d{8}[A-Z]\b|\b[6-9]\d{8}\b|ES\d{22}|@/.test(v.replace(/\s/g,' '));
  o.innerHTML = hit ? `<div class="ai fade" style="border-left-color:var(--red);background:linear-gradient(90deg,var(--red-l),#fff)"><div class="t" style="color:var(--red)">${ic('alert')}Envío bloqueado por DLP</div>El mensaje contiene datos personales (DNI o teléfono). No se envía al proveedor externo y el intento queda registrado en auditoría.</div>` : `<div class="ai fade"><div class="t">${ic('check')}Mensaje permitido</div>No se han detectado datos personales. El mensaje se envía al modelo configurado.</div>`; }

NX.audRows = () => { const f = $('#af').value;
  $('#ab').innerHTML = LOGS.map((l,i)=>[l,i]).filter(([l])=>!f||l.u===f).map(([l,i])=>`<tr class="cl" onclick="openLog(${i})"><td class="muted">${l.t}</td><td>${l.u}</td><td>${l.tool}</td><td><span class="pill gray">${l.m}</span></td><td>${l.tok}</td><td>${l.c}</td><td>${l.s==='ok'?'<span class="pill green">Completado</span>':l.s==='dlp'?'<span class="pill red">Bloqueado DLP</span>':l.s==='perm'?'<span class="pill amber">Contexto restringido</span>':'<span class="pill amber">Guardarraíl</span>'}</td></tr>`).join(''); };
function openLog(i){ const l = LOGS[i];
  openDrawer('Registro de auditoría', `<div class="kv"><dt>Usuario</dt><dd>${l.u}</dd><dt>Fecha y hora</dt><dd>${l.t}</dd><dt>Herramienta</dt><dd>${l.tool}</dd><dt>Modelo</dt><dd>${l.m}</dd><dt>Consumo</dt><dd>${l.tok} tokens · ${l.c}</dd></div>
  <label class="f">Consulta enviada</label><div class="bubble me" style="max-width:100%">${l.p}</div><label class="f" style="margin-top:6px">Respuesta</label><div class="bubble bot" style="max-width:100%">${l.r}</div>
  <p class="muted" style="margin-top:12px">Registro inalterable, disponible para auditorías internas y de cumplimiento.</p>`); }

/* =================== arranque =================== */
$('#role').innerHTML = Object.keys(ROLES).map(r=>`<option>${r}</option>`).join('');
$('#role').onchange = e => { role = e.target.value; const u = ROLES[role].user; $('#uname').textContent = u[0]; $('#uav').textContent = u[1]; $('#urole').textContent = role; buildNav(); if((current!=='home' && current!=='nexus' && !ROLES[role].tools.includes(current)) || (current==='nexus' && !ROLES[role].nexus)) current = 'home'; go(current); toast(`Viendo el Hub como <b>${role}</b>: ${ROLES[role].tools.length} herramientas disponibles`); };
$('#model').onchange = e => toast(`Modelo cambiado a <b>${e.target.value}</b>. Las herramientas siguen funcionando igual.`);
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
buildNav(); go('home');
