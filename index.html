<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub IA · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0D1A; --ink-2:#1B2140; --text2:#545B70; --text3:#8D93A5;
  --bg:#F3F5FB; --card:rgba(255,255,255,.74); --solid:#FFFFFF; --border:rgba(11,13,26,.07); --border-soft:rgba(11,13,26,.05);
  --blue:#2563EB; --blue-d:#1E3A8A; --blue-n:#0A1D8A; --blue-l:#E8EEFE; --blue-s:rgba(37,99,235,.07);
  --red:#EE1554; --red-l:#FDE7EE; --amber:#F59E0B; --amber-l:#FEF3DC; --green:#16A34A; --green-l:#E3F5E9;
  --night:#05050A; --night-2:#0F0F18; --gov:#4BE0A1;
  --sig: linear-gradient(90deg,#2563EB 0%,#EE1554 60%,#F59E0B 100%);
  --r:24px; --ri:16px;
  --sh: 0 4px 12px rgba(2,6,23,.04), 0 24px 60px rgba(2,6,23,.07);
  --sh-s: 0 2px 8px rgba(2,6,23,.04), 0 12px 30px rgba(2,6,23,.05);
  --glow: 0 0 24px rgba(37,99,235,.28);
  --side-w:80px;
}
body.open{--side-w:268px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);font-size:14px;min-height:100vh;
  background:radial-gradient(circle at 0% 0%,rgba(37,99,235,.13),transparent 32%),radial-gradient(circle at 90% 12%,rgba(238,21,84,.08),transparent 28%),radial-gradient(circle at 60% 100%,rgba(245,158,11,.07),transparent 34%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4,.kpi .v,.deal .am,.hd-meta b{font-family:'Space Grotesk',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.glass{background:var(--card);border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh)}

/* ---------- barra lateral desplegable (raíl flotante) ---------- */
.side{position:fixed;left:16px;top:16px;bottom:16px;width:var(--side-w);z-index:40;border-radius:var(--r);padding:18px 14px;display:flex;flex-direction:column;overflow:hidden;
  transition:width .28s cubic-bezier(.4,0,.2,1)}
.side::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 45%,rgba(37,99,235,.07));pointer-events:none}
.side::after{content:"";position:absolute;left:12px;top:24px;width:56px;height:110px;border-radius:50%;background:rgba(37,99,235,.16);filter:blur(26px);pointer-events:none}
.side>*{position:relative;z-index:1}
.s-top{display:flex;align-items:center;gap:12px;min-height:52px}
.mark{width:52px;height:52px;border-radius:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(135deg,#2563EB,#0A1D8A);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--sig)}
.mark svg{width:24px;height:24px}
.lbl{white-space:nowrap;opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s;pointer-events:none}
body.open .lbl{opacity:1;transform:none;pointer-events:auto;transition-delay:.08s}
.s-brand img{height:17px;display:block}
.s-brand span{display:block;font-size:11.5px;color:var(--text2);margin-top:4px}
.s-tog{margin:16px 0 6px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.4);display:flex;align-items:center;gap:10px;padding:0 13px;color:var(--text2);font-size:12px;font-weight:600;width:100%}
.s-tog:hover{background:rgba(255,255,255,.75);color:var(--ink)}
.s-tog svg{transition:transform .28s}
body.open .s-tog svg{transform:rotate(180deg)}
nav{flex:1;overflow-y:auto;overflow-x:hidden;margin:4px -4px 0;padding:0 4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav .sec{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);height:26px;display:flex;align-items:flex-end;padding:0 0 6px 6px;white-space:nowrap}
nav .sec::before{content:"";width:22px;height:1px;background:rgba(11,13,26,.12);margin:0 auto 4px;display:block}
body.open nav .sec::before{display:none}
body:not(.open) nav .sec span{display:none}
nav a{display:flex;align-items:center;gap:13px;height:52px;border-radius:18px;color:var(--text2);text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:6px;
  background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transition:background .2s,color .2s,box-shadow .2s;position:relative;cursor:pointer;padding:0 15px;white-space:nowrap}
nav a svg{width:21px;height:21px}
nav a:hover{background:rgba(255,255,255,.72);color:var(--ink)}
nav a.on{background:linear-gradient(135deg,#2563EB,#1E3A8A);color:#fff;box-shadow:var(--glow)}
nav a .b{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(11,13,26,.06);border-radius:10px;padding:2px 8px}
nav a.on .b{background:rgba(255,255,255,.2)}
nav a.nx{background:rgba(75,224,161,.12);box-shadow:inset 0 0 0 1px rgba(75,224,161,.4)}
nav a.nx svg{color:#0F9A63}
nav a.nx.on{background:linear-gradient(135deg,#05050A,#1B2140);box-shadow:0 0 22px rgba(75,224,161,.35),inset 0 0 0 1px rgba(75,224,161,.6)}
nav a.nx.on svg{color:var(--gov)}
nav a.hidden{display:none}
nav a.off{opacity:.45;cursor:default}
body:not(.open) nav a .t, body:not(.open) nav a .b{display:none}
body:not(.open) nav a[data-tip]:hover::after{content:attr(data-tip);position:fixed;left:calc(var(--side-w) + 26px);background:var(--night);color:#fff;font-size:12px;font-weight:600;padding:7px 11px;border-radius:10px;white-space:nowrap;box-shadow:var(--sh-s);z-index:60}
.s-foot{margin-top:10px;border-radius:var(--ri);background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:48px;white-space:nowrap}
.s-foot .dt{width:9px;height:9px;border-radius:50%;background:var(--gov);box-shadow:0 0 10px var(--gov);flex-shrink:0;margin-left:6px}
.s-foot .lbl{font-size:11.5px;color:var(--text2);font-weight:600}

/* ---------- zona principal ---------- */
main{margin-left:calc(var(--side-w) + 32px);padding:16px 22px 48px 0;min-height:100vh;transition:margin-left .28s cubic-bezier(.4,0,.2,1)}
header{position:sticky;top:16px;z-index:30;border-radius:var(--r);padding:12px 14px 12px 22px;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.82)}
header h1{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
header .crumb{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap}
header h1{white-space:nowrap}
header .sp{flex:1}
.search{display:flex;align-items:center;gap:12px;height:50px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(243,245,251,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);padding:0 16px;min-width:260px;flex:0 1 360px}
.search .eb{font-size:10.5px;font-weight:700;letter-spacing:.22em;color:var(--text3)}
.search input{border:none;background:transparent;outline:none;flex:1;min-width:0;font-size:13.5px}
.search:focus-within{background:#fff;box-shadow:var(--glow)}
.hbox{height:50px;border-radius:18px;background:rgba(243,245,251,.85);border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;gap:10px;padding:0 14px}
.hbox .k{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text3)}
.hbox select{border:none;background:transparent;font-weight:700;font-size:12.8px;outline:none;cursor:pointer;max-width:170px}
.me{display:flex;align-items:center;gap:10px}
.me b{display:block;font-size:13px;line-height:1.15}
.me select{border:none;background:transparent;font-size:11.5px;color:var(--text2);outline:none;cursor:pointer;padding:0;margin-left:-3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--text2);white-space:nowrap}
.chip.demo{background:var(--amber-l);color:#B45309}
.chip.ok{background:var(--green-l);color:#15803D}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.hchips{display:flex;flex-direction:column;gap:5px}
#view{padding-top:18px}

/* ---------- héroe de cada vista ---------- */
.hd{border-radius:var(--r);padding:30px 34px;margin-bottom:16px;display:grid;grid-template-columns:1.35fr 1fr;gap:30px;align-items:center;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(255,255,255,.88),rgba(232,238,254,.72));border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh)}
.hd::after{content:"";position:absolute;right:-60px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.14),transparent 65%);pointer-events:none}
.hd.solo{grid-template-columns:1fr}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.eyebrow::before{content:"";width:24px;height:2px;border-radius:2px;background:var(--sig)}
.hd h2{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.06}
.hd h2 .acc{color:var(--blue)}
.hd p{color:var(--text2);font-size:14px;margin-top:12px;max-width:640px;line-height:1.65}
.hd-meta{display:grid;grid-template-columns:1fr 1fr;gap:26px;position:relative;z-index:1}
.hd-meta span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.hd-meta b{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.01em}

/* ---------- componentes ---------- */
.card{border-radius:var(--r);padding:22px 24px;position:relative;overflow:hidden;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh-s)}
.card.top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--sig)}
.card h3{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h3 .r{margin-left:auto;font-family:'Manrope',sans-serif;font-size:11.5px;font-weight:600;color:var(--text3);letter-spacing:0}
.g{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:1.55fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:16px}
.kpi{padding:20px 22px}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:11px}
.kpi .l .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,currentColor 11%,transparent);flex-shrink:0}
.kpi .l .ic svg{width:17px;height:17px}
.kpi .v{font-size:34px;font-weight:700;letter-spacing:-.04em;margin-top:14px;line-height:1;color:var(--blue-d)}
.kpi .v small{font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;color:var(--text3);letter-spacing:0}
.kpi .d{font-size:12px;margin-top:8px;color:var(--text2)}
.kpi .trd{position:absolute;right:18px;top:18px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.kpi .trd.up{background:var(--green-l);color:#15803D}.kpi .trd.down{background:var(--red-l);color:var(--red)}
.up{color:#15803D;font-weight:700}.down{color:var(--red);font-weight:700}
.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-amber{color:#D97706}.c-green{color:var(--green)}.c-gov{color:#0F9A63}
.bar{height:9px;border-radius:999px;background:rgba(11,13,26,.06);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0A1D8A,#2563EB)}
.bar.warn>i{background:linear-gradient(90deg,#EE1554,#F59E0B)}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
th{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);text-align:left;padding:4px 12px 2px}
td{padding:11px 12px;vertical-align:middle;background:var(--blue-s)}
td:first-child{border-radius:14px 0 0 14px}td:last-child{border-radius:0 14px 14px 0}
tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(37,99,235,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--blue-l);color:var(--blue);white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.green{background:var(--green-l);color:#15803D}.pill.red{background:var(--red-l);color:var(--red)}.pill.amber{background:var(--amber-l);color:#B45309}.pill.gray{background:rgba(255,255,255,.9);color:var(--text2);box-shadow:inset 0 0 0 1px var(--border);text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600}
.pill.gov{background:rgba(75,224,161,.18);color:#0F7A4E}
.user{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#2563EB,#EE1554);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.user .av{width:30px;height:30px;border-radius:10px;font-size:10.5px}
.user b{font-weight:700;font-size:13px;display:block;line-height:1.2}.user span{font-size:11px;color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:12.8px;background:var(--night);color:#fff;transition:transform .12s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn.blue{background:linear-gradient(135deg,#2563EB,#1E3A8A);box-shadow:var(--glow)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(37,99,235,.25);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.btn.sm{padding:7px 13px;font-size:11.5px}
.btn.ghost.sm{font-size:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
label.f{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
input.f,select.f,textarea.f{width:100%;border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:12px 14px;background:rgba(243,245,251,.9);font-size:13.5px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
input.f:focus,select.f:focus,textarea.f:focus{background:#fff;box-shadow:var(--glow)}
textarea.f{resize:vertical;line-height:1.55}
.night{background:linear-gradient(140deg,#05050A,#141833);color:#fff;border-radius:var(--r);padding:22px 24px;border:1px solid rgba(37,99,235,.7);box-shadow:0 0 0 1px rgba(37,99,235,.12),0 0 30px rgba(37,99,235,.22) inset,var(--sh)}
.night h3{color:#fff;font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:10px}
.night h3 i{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);display:inline-block}
.night p,.night li{color:rgba(255,255,255,.84);font-size:13px;line-height:1.6}
.night.gv{border-color:rgba(75,224,161,.7);box-shadow:0 0 30px rgba(75,224,161,.16) inset,var(--sh)}
.night.gv h3 i{background:var(--gov);box-shadow:0 0 10px var(--gov)}
ul.dots{list-style:none}ul.dots li{padding-left:16px;position:relative;margin-bottom:7px;font-size:13px;line-height:1.55;color:var(--text2)}
ul.dots li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.night ul.dots li{color:rgba(255,255,255,.85)}
.ai{border-radius:18px;padding:14px 16px;font-size:13px;line-height:1.6;color:var(--ink-2);background:linear-gradient(120deg,rgba(232,238,254,.95),rgba(255,255,255,.85));box-shadow:inset 0 0 0 1px rgba(37,99,235,.14)}
.ai .t{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin-bottom:5px;display:flex;gap:7px;align-items:center}
.ai .t svg{width:14px;height:14px}
.muted{color:var(--text2);font-size:12px}
.feed li{list-style:none;display:flex;gap:12px;padding:11px 14px;margin-bottom:6px;border-radius:14px;background:var(--blue-s);font-size:12.6px;line-height:1.45;align-items:center}
.feed .tm{color:var(--text3);font-size:11px;white-space:nowrap;margin-left:auto}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh-s)}
.tabs button{border:none;background:transparent;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--text2)}
.tabs button:hover{background:rgba(37,99,235,.07);color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,#2563EB,#1E3A8A);color:#fff;box-shadow:var(--glow)}
.typing::after{content:"▍";animation:bl 1s infinite;color:var(--blue)}
@keyframes bl{50%{opacity:0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue-l);border-top-color:var(--blue);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .4s ease both}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;right:24px;bottom:24px;background:rgba(5,5,10,.92);backdrop-filter:blur(10px);color:#fff;border-radius:18px;padding:13px 18px;font-size:13px;box-shadow:0 14px 40px rgba(11,13,26,.28);border:1px solid rgba(37,99,235,.55);display:flex;gap:10px;align-items:center;transform:translateY(130%);opacity:0;transition:all .3s;z-index:70;max-width:420px}
.toast.on{transform:none;opacity:1}
.drawer{position:fixed;top:16px;right:16px;bottom:16px;width:470px;max-width:92vw;border-radius:var(--r);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);box-shadow:-20px 0 60px rgba(11,13,26,.18);transform:translateX(110%);transition:transform .3s,visibility .3s;visibility:hidden;z-index:50;display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer .dh{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-size:16px}
.drawer .db{padding:20px 24px;overflow-y:auto;flex:1}
.drawer .x{margin-left:auto;background:rgba(11,13,26,.05);border:none;border-radius:12px;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--text3);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;align-self:center}
.bubble{border-radius:18px;padding:12px 15px;font-size:13px;line-height:1.55;margin-bottom:10px;max-width:88%}
.bubble.me{background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble.bot{background:rgba(255,255,255,.95);box-shadow:inset 0 0 0 1px var(--border);border-bottom-left-radius:6px}
.src{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chatbox{display:flex;flex-direction:column;height:440px}
.chatbox .msgs{flex:1;overflow-y:auto;padding:4px 2px 10px}
.chatbox .in{display:flex;gap:8px;padding-top:12px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sugg button{border:none;background:rgba(37,99,235,.08);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:600;color:var(--blue-d)}
.sugg button:hover{background:rgba(37,99,235,.16)}
.drop{border:2px dashed rgba(37,99,235,.25);border-radius:20px;padding:32px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(232,238,254,.6))}
.drop svg{width:36px;height:36px;color:var(--blue)}
.diff td{background:var(--red-l)!important}
.tog{width:40px;height:23px;border-radius:999px;background:#D3D8E4;position:relative;border:none;transition:background .2s;flex-shrink:0}
.tog::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:linear-gradient(135deg,#16A34A,#4BE0A1)}.tog.on::after{left:20px}
.rule{display:flex;gap:14px;align-items:center;padding:13px 14px;margin-bottom:6px;border-radius:14px;background:var(--blue-s)}
.rule b{font-size:13px;display:block}.rule span{font-size:12px;color:var(--text2)}
.post{border-radius:22px;padding:14px;background:rgba(255,255,255,.88);box-shadow:var(--sh-s);border:1px solid rgba(255,255,255,.7)}
.post .ph{height:120px;border-radius:16px;background:linear-gradient(135deg,#0A1D8A,#2563EB 45%,#EE1554 80%,#F59E0B);margin-bottom:12px;display:flex;align-items:flex-end;padding:10px 12px;color:#fff;font-size:11px;font-weight:700}
.post p{font-size:12.8px;line-height:1.55;white-space:pre-line}
.post .meta{display:flex;gap:6px;margin-top:10px;align-items:center}
.lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;color:var(--text2);border-radius:var(--r);background:rgba(255,255,255,.7);box-shadow:var(--sh-s);padding:40px}
.lock svg{width:46px;height:46px;color:var(--red);margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.col{border-radius:var(--r);padding:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7)}
.col h4{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;justify-content:space-between;font-family:'Manrope',sans-serif}
.deal{background:rgba(255,255,255,.95);border-radius:18px;padding:13px 14px;margin-bottom:9px;cursor:pointer;box-shadow:var(--sh-s);border:1px solid transparent}
.deal:hover{border-color:rgba(37,99,235,.35)}
.deal b{font-size:13px;display:block}.deal .am{font-size:19px;font-weight:700;letter-spacing:-.03em;margin:4px 0;color:var(--blue-d)}
.deal .nx{font-size:11.5px;color:var(--text2);line-height:1.45;display:flex;gap:6px}
.deal .nx svg{width:14px;height:14px;margin-top:1px}
@media (max-width:1200px){.search{display:none}}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3,.g21,.g12,.pipe,.hd{grid-template-columns:1fr}.hchips{display:none}}
</style>
</head>

let role = 'Dirección', current = 'home';
function buildNav(){
  const R = ROLES[role];
  const item = (v, icon, name, cls='', badge='') => `<a data-v="${v}" data-tip="${name}" class="${cls}">${ic(icon)}<span class="t lbl">${name}</span>${badge?`<span class="b lbl">${badge}</span>`:''}</a>`;
  let h = item('home','home','Inicio') + `<div class="sec"><span class="lbl">Herramientas IA</span></div>`;
  TOOLS.forEach(t => h += item(t.id, t.icon, t.name, R.tools.includes(t.id)?'':'hidden'));
  h += `<div class="sec"><span class="lbl">Gobierno de la IA</span></div>`;
  h += R.nexus ? item('nexus','nexus','NexusMind','nx','Gobierno') : `<a class="off" data-tip="NexusMind · sin acceso">${ic('lock')}<span class="t lbl">NexusMind</span><span class="b lbl">Sin acceso</span></a>`;
  $('#nav').innerHTML = h;
  document.querySelectorAll('#nav a[data-v]').forEach(a => a.onclick = () => go(a.dataset.v));
  mark();
}
function mark(){ document.querySelectorAll('#nav a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === current)); }
function go(v){
  current = v; mark();
  const R = ROLES[role];
  const t = TOOLS.find(x => x.id === v);
  if(v === 'home'){ setHead('Inicio','Hub IA · Resumen de actividad'); return home(); }
  if(v === 'nexus'){ if(!R.nexus) return denied('NexusMind'); setHead('NexusMind','Gobierno de la IA'); return nexus(); }
  if(!R.tools.includes(v)) return denied(t.name);
  setHead(t.name, 'Herramientas IA');
  VIEWS[v]();
}
function setHead(t,c){ $('#title').textContent = t; $('#crumb').textContent = c; $('#view').scrollTop = 0; }
function denied(n){
  setHead(n,'Acceso restringido');
  $('#view').innerHTML = `<div class="lock fade">${ic('lock')}<h2 style="font-size:20px">Tu perfil no tiene acceso a ${n}</h2><p style="margin-top:6px;max-width:440px">Los permisos se gestionan por roles desde NexusMind. Cambia de perfil en la cabecera para ver qué herramientas ve cada persona.</p></div>`;
}
function toast(html, ms=3200){ const t = $('#toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), ms); }
function openDrawer(title, body){ $('#dtitle').innerHTML = title; $('#dbody').innerHTML = body; $('#drawer').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); }
function hd(eb, title, p, meta){ const m = meta ? `<div class="hd-meta">${meta.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>` : ''; return `<div class="hd fade ${meta?'':'solo'}"><div><div class="eyebrow">${eb}</div><h2>${title}</h2>${p?`<p>${p}</p>`:''}</div>${m}</div>`; }
function kpi(icn, col, l, v, d){ const tr = d.includes('▲') ? '<span class="trd up">↑</span>' : d.includes('▼') ? '<span class="trd down">↓</span>' : ''; return `<div class="card kpi">${tr}<div class="l"><span class="ic ${col}">${ic(icn)}</span>${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`; }
function userCell(n, sub){ const ini = n.split(' ').map(x=>x[0]).join(''); return `<div class="user"><div class="av">${ini}</div><div><b>${n}</b><span>${sub}</span></div></div>`; }
function spark(arr, col='#2563EB'){ const w=90,h=26,mx=Math.max(...arr),mn=Math.min(...arr); const pts = arr.map((v,i)=>`${(i/(arr.length-1))*w},${h-((v-mn)/(mx-mn||1))*(h-4)-2}`).join(' '); return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
async function typeInto(el, text, speed=8){ el.classList.add('typing'); el.textContent=''; for(let i=0;i<text.length;i+=3){ el.textContent = text.slice(0,i+3); await sleep(speed);} el.classList.remove('typing'); }

/* =================== gráficos =================== */
function barsChart(data, h=250){
  const w = 760, mx = Math.max(...data), bw = w/data.length;
  let s = `<svg viewBox="0 0 ${w} ${h+22}" width="100%" preserveAspectRatio="none" style="display:block"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0A1D8A"/></linearGradient></defs>`;
  [0.25,0.5,0.75,1].forEach(f=> s += `<line x1="0" x2="${w}" y1="${h-h*f}" y2="${h-h*f}" stroke="#EFF1F5"/>`);
  data.forEach((v,i)=>{ const bh = (v/mx)*(h-10); s += `<rect x="${i*bw+3}" y="${h-bh}" width="${bw-6}" height="${bh}" rx="4" fill="${i===data.length-1?'#EE1554':'url(#gb)'}"><title>${v} consultas</title></rect>`; if(i%5===0){ const dt = new Date(2026,9,19+i); s += `<text x="${i*bw+bw/2}" y="${h+16}" font-size="10" text-anchor="middle" fill="#9298A8">${dt.getDate()} ${['oct','nov'][dt.getMonth()-9]}</text>`; } });
  return s + '</svg>';
}
function lineChart(series, labels, h=190){
  const w=760, all = series.flatMap(s=>s.d), mx = Math.max(...all)*1.1, mn = 0;
  const X = i => 20 + i*(w-40)/(labels.length-1), Y = v => h - ((v-mn)/(mx-mn))*(h-20);
  let s = `<svg viewBox="0 0 ${w} ${h+22}" width="100%" style="display:block">`;
  [0.25,0.5,0.75,1].forEach(f=> s += `<line x1="0" x2="${w}" y1="${h-(h-20)*f}" y2="${h-(h-20)*f}" stroke="#EFF1F5"/>`);
  series.forEach(se => {
    const pts = se.d.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    if(se.fill) s += `<polygon points="${X(0)},${h} ${pts} ${X(se.d.length-1)},${h}" fill="${se.c}" opacity=".08"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${se.c}" stroke-width="2.5" ${se.dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    se.d.forEach((v,i)=> s += `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="#fff" stroke="${se.c}" stroke-width="2"><title>${labels[i]}: ${num(v)}</title></circle>`);
  });
  labels.forEach((l,i)=> s += `<text x="${X(i)}" y="${h+16}" font-size="10" text-anchor="middle" fill="#9298A8">${l}</text>`);
  return s + '</svg>';
}
function donut(parts, size=150){
  const r=56, c=2*Math.PI*r; let off=0, s=`<svg width="${size}" height="${size}" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#EFF1F5" stroke-width="18"/>`;
  parts.forEach(p=>{ const len = c*p.v/100; s += `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; });
  return s + `<text x="75" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#0B0D1A">412 €</text><text x="75" y="90" text-anchor="middle" font-size="10" fill="#9298A8">este mes</text></svg>`;
}

};

};
async function dlpTest(){ const v = $('#dl').value; const o = $('#dlo'); o.innerHTML = '<span class="spin"></span>'; await sleep(600);
  const hit = /\b\d{8}[A-Z]\b|\b[6-9]\d{8}\b|ES\d{22}|@/.test(v.replace(/\s/g,' '));
  o.innerHTML = hit ? `<div class="ai fade" style="border-left-color:var(--red);background:linear-gradient(90deg,var(--red-l),#fff)"><div class="t" style="color:var(--red)">${ic('alert')}Envío bloqueado por DLP</div>El mensaje contiene datos personales (DNI o teléfono). No se envía al proveedor externo y el intento queda registrado en auditoría.</div>` : `<div class="ai fade"><div class="t">${ic('check')}Mensaje permitido</div>No se han detectado datos personales. El mensaje se envía al modelo configurado.</div>`; }

};
NX.audRows = () => { const f = $('#af').value;
  $('#ab').innerHTML = LOGS.map((l,i)=>[l,i]).filter(([l])=>!f||l.u===f).map(([l,i])=>`<tr class="cl" onclick="openLog(${i})"><td class="muted">${l.t}</td><td>${l.u}</td><td>${l.tool}</td><td><span class="pill gray">${l.m}</span></td><td>${l.tok}</td><td>${l.c}</td><td>${l.s==='ok'?'<span class="pill green">Completado</span>':l.s==='dlp'?'<span class="pill red">Bloqueado DLP</span>':l.s==='perm'?'<span class="pill amber">Contexto restringido</span>':'<span class="pill amber">Guardarraíl</span>'}</td></tr>`).join(''); };
function openLog(i){ const l = LOGS[i];
  openDrawer('Registro de auditoría', `<div class="kv"><dt>Usuario</dt><dd>${l.u}</dd><dt>Fecha y hora</dt><dd>${l.t}</dd><dt>Herramienta</dt><dd>${l.tool}</dd><dt>Modelo</dt><dd>${l.m}</dd><dt>Consumo</dt><dd>${l.tok} tokens · ${l.c}</dd></div>
  <label class="f">Consulta enviada</label><div class="bubble me" style="max-width:100%">${l.p}</div><label class="f" style="margin-top:6px">Respuesta</label><div class="bubble bot" style="max-width:100%">${l.r}</div>
  <p class="muted" style="margin-top:12px">Registro inalterable, disponible para auditorías internas y de cumplimiento.</p>`); }

/* =================== arranque =================== */
$('#role').innerHTML = Object.keys(ROLES).map(r=>`<option>${r}</option>`).join('');
$('#role').onchange = e => { role = e.target.value; const u = ROLES[role].user; $('#uname').textContent = u[0]; $('#uav').textContent = u[1]; buildNav(); if((current!=='home' && current!=='nexus' && !ROLES[role].tools.includes(current)) || (current==='nexus' && !ROLES[role].nexus)) current = 'home'; go(current); toast(`Viendo el Hub como <b>${role}</b>: ${ROLES[role].tools.length} herramientas disponibles`); };
$('#model').onchange = e => toast(`Modelo cambiado a <b>${e.target.value}</b>. Las herramientas siguen funcionando igual.`);
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
const setOpen = o => { document.body.classList.toggle('open', o); $('#stog').title = o ? 'Contraer menú' : 'Desplegar menú'; try { localStorage.setItem('hubia-side', o ? '1' : '0'); } catch(e){} };
let startOpen = true; try { startOpen = localStorage.getItem('hubia-side') !== '0'; } catch(e){}
setOpen(startOpen);
$('#stog').onclick = () => setOpen(!document.body.classList.contains('open'));
buildNav(); go('home');
</script>
